name: release

on:
    push:
        tags: ["v*"]

permissions:
    contents: read
    actions: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        uses: ./.github/workflows/build.yml

    release:
        needs: build
        runs-on: ubuntu-slim
        permissions:
            contents: write
            actions: read
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/download-artifact@v8
              with:
                  pattern: spoti-*.tar.zst
                  path: build/release
                  merge-multiple: true
            - name: rename assets
              run: |
                  for platform in linux-x64 linux-arm64 macos-arm64 windows-x64; do
                    mv build/release/spoti-$platform-*.tar.zst build/release/spoti-$platform.tar.zst
                  done
            - uses: hyperpuncher/release-notes@v1
              id: notes
            - run: gh release create "$GITHUB_REF_NAME" build/release/spoti-*.tar.zst --verify-tag --title "$GITHUB_REF_NAME" --notes-file "${{ steps.notes.outputs.path }}"

    aur:
        needs: release
        runs-on: ubuntu-26.04
        permissions:
            contents: read
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@v7
            - name: download linux assets
              run: |
                  mkdir -p build/release
                  gh release download "$GITHUB_REF_NAME" --pattern 'spoti-linux-*.tar.zst' --dir build/release
            - name: prepare package recipes
              env:
                  VERSION: ${{ github.ref_name }}
              run: |
                  VERSION=${VERSION#v}
                  mkdir -p build/release/aur
                  docker run --rm -v "$PWD:/work" -w /work -e VERSION="$VERSION" archlinux:base-devel bash -c '
                    useradd --create-home builder
                    chown -R builder:builder build/release/aur
                    runuser --user builder -- bash scripts/prepare-aur.sh "$VERSION" build/release build/release/aur
                  '
            - name: publish AUR packages
              env:
                  AUR_KEY: ${{ secrets.AUR_KEY }}
              run: |
                  umask 077
                  test -n "$AUR_KEY"
                  printf '%s\n' "$AUR_KEY" > "$RUNNER_TEMP/aur_key"
                  trap 'shred -u "$RUNNER_TEMP/aur_key"' EXIT
                  export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/aur_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$GITHUB_WORKSPACE/.github/aur_known_hosts"
                  for package in spoti-bin spoti-git; do
                    directory="$RUNNER_TEMP/$package"
                    git -c init.defaultBranch=master clone --depth=1 --single-branch --no-tags "ssh://aur@aur.archlinux.org/$package.git" "$directory"
                    cp "build/release/aur/$package/PKGBUILD" "build/release/aur/$package/.SRCINFO" LICENSE "$directory/"
                    git -C "$directory" config user.name hyperpuncher
                    git -C "$directory" config user.email hyperpuncher@users.noreply.github.com
                    git -C "$directory" add PKGBUILD .SRCINFO LICENSE
                    if ! git -C "$directory" diff --cached --quiet; then
                      git -C "$directory" commit -m "chore: update $package for $GITHUB_REF_NAME"
                      git -C "$directory" push origin HEAD:master
                    fi
                  done

    homebrew:
        needs: release
        runs-on: ubuntu-slim
        permissions:
            contents: read
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@v7
            - name: generate cask
              run: |
                  gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
                    --jq '.assets[] | "\(.name)\t\(.digest)"' > "$RUNNER_TEMP/assets.tsv"
                  checksum=$(awk -F'\t' '$1 == "spoti-macos-arm64.tar.zst" { sub(/^sha256:/, "", $2); print $2 }' "$RUNNER_TEMP/assets.tsv")
                  if [[ -z $checksum ]]; then
                    echo "missing release asset digest" >&2
                    exit 1
                  fi
                  VERSION="${GITHUB_REF_NAME#v}"
                  mkdir -p build/release
                  sed -e "s/@VERSION@/$VERSION/g" -e "s/@SHA256@/$checksum/g" \
                    packaging/homebrew/spoti.rb.in > build/release/spoti.rb
            - name: publish cask
              env:
                  GH_TOKEN: ${{ secrets.GH_PAT }}
              run: |
                  test -n "$GH_TOKEN"
                  gh auth setup-git --hostname github.com
                  directory="$RUNNER_TEMP/homebrew-tap"
                  git clone --depth=1 --single-branch --no-tags https://github.com/hyperpuncher/homebrew-tap.git "$directory"
                  mkdir -p "$directory/Casks"
                  cp build/release/spoti.rb "$directory/Casks/spoti.rb"
                  git -C "$directory" config user.name hyperpuncher
                  git -C "$directory" config user.email hyperpuncher@users.noreply.github.com
                  git -C "$directory" add Casks/spoti.rb
                  if ! git -C "$directory" diff --cached --quiet; then
                    git -C "$directory" commit -m "chore: update spoti for $GITHUB_REF_NAME"
                    git -C "$directory" push
                  fi
