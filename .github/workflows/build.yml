name: desktop builds

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  actions: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: install dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang just pkg-config libsdl3-dev libsdl3-ttf-dev libfontconfig-dev libcurl4-openssl-dev libvorbis-dev libwebp-dev libsecret-1-dev libsystemd-dev fonts-noto-core fonts-noto-cjk fonts-noto-extra fonts-noto-color-emoji
          mkdir -p "$RUNNER_TEMP/odin"
          gh release download --repo odin-lang/Odin --pattern 'odin-linux-amd64-*.tar.gz' --output "$RUNNER_TEMP/odin.tar.gz"
          tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin" --strip-components=1
          "$RUNNER_TEMP/odin/vendor/stb/src/build_stb.sh"
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"
      - name: check and test
        run: |
          just check
          just test
      - name: build
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: just release
      - name: archive
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: sh packaging/linux/bundle.sh "build/spoti-linux-x64-${GITHUB_SHA:0:12}.tar.zst"
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        with:
          path: build/spoti-linux-x64-*.tar.zst
          archive: false
          if-no-files-found: error

  macos:
    needs: linux
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: install dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          brew install just pkg-config dylibbundler sdl3 sdl3_ttf fontconfig curl libvorbis webp
          mkdir -p "$RUNNER_TEMP/odin"
          gh release download --repo odin-lang/Odin --pattern 'odin-macos-arm64-*.tar.gz' --output "$RUNNER_TEMP/odin.tar.gz"
          tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin" --strip-components=1
          "$RUNNER_TEMP/odin/vendor/stb/src/build_stb.sh"
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"
      - name: test native credential queries
        run: odin test spotify/credential
      - run: just release
      - name: bundle
        run: sh packaging/macos/bundle.sh "build/spoti-macos-arm64-${GITHUB_SHA:0:12}.tar.zst"
      - uses: actions/upload-artifact@v7
        with:
          path: build/spoti-macos-arm64-*.tar.zst
          archive: false
          if-no-files-found: error

  windows:
    needs: linux
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: install dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          winget install --id odin-lang.Odin --exact --silent --accept-package-agreements --accept-source-agreements
          winget install --id Casey.Just --exact --silent --accept-package-agreements --accept-source-agreements
          vcpkg install --triplet x64-windows fontconfig curl[websockets] libvorbis libwebp
          $root = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          $odin = Get-ChildItem "$env:LOCALAPPDATA/Microsoft/WinGet/Packages" -Filter odin.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($odin) {
            $odin.DirectoryName >> $env:GITHUB_PATH
            $env:PATH = "$($odin.DirectoryName);$env:PATH"
          }
          "$env:LOCALAPPDATA/Microsoft/WinGet/Links", "$root/bin" >> $env:GITHUB_PATH
          $env:PATH = "$env:LOCALAPPDATA/Microsoft/WinGet/Links;$root/bin;$env:PATH"
          odin version
          just --version
          "SPOTI_LINKER_FLAGS=/LIBPATH:$PWD/build/deps/SDL3-3.4.18/lib/x64 /LIBPATH:$PWD/build/deps/SDL3_ttf-3.2.2/lib/x64 /LIBPATH:$root/lib" >> $env:GITHUB_ENV
          "FONTCONFIG_FILE=$root/etc/fonts/fonts.conf" >> $env:GITHUB_ENV
          "FONTCONFIG_PATH=$root/etc/fonts" >> $env:GITHUB_ENV
      - run: just release
      - name: archive
        run: pwsh -NoProfile -File packaging/windows/bundle.ps1 "build/spoti-windows-x64-$($env:GITHUB_SHA.Substring(0,12)).tar.zst"
      - uses: actions/upload-artifact@v7
        with:
          path: build/spoti-windows-x64-*.tar.zst
          archive: false
          if-no-files-found: error

  publish:
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: spoti-*.tar.zst
          path: build/release
          merge-multiple: true
      - name: prepare release assets and AUR recipes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION=${VERSION#v}
          for platform in linux-x64 macos-arm64 windows-x64; do
            mv build/release/spoti-$platform-*.tar.zst build/release/spoti-$platform.tar.zst
          done
          mkdir -p build/release/aur
          docker run --rm -v "$PWD:/work" -w /work -e VERSION="$VERSION" archlinux:base-devel bash -c '
            useradd --create-home builder
            chown -R builder:builder build/release/aur
            runuser --user builder -- bash scripts/prepare-aur.sh "$VERSION" build/release/spoti-linux-x64.tar.zst build/release/aur
          '
          tar -czf "build/release/spoti-aur-$VERSION.tar.gz" -C build/release/aur spoti-bin spoti-git
      - name: generate release notes
        run: bash scripts/release-notes.sh > build/release/notes.md
      - name: publish release
        uses: softprops/action-gh-release@v3
        with:
          body_path: build/release/notes.md
          fail_on_unmatched_files: true
          files: |
            build/release/spoti-*.tar.zst
            build/release/spoti-aur-*.tar.gz
