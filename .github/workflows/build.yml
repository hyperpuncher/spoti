name: desktop builds

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  ODIN_RELEASE: dev-2026-10

jobs:
  linux:
    name: linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: install system packages
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends clang just pkg-config libsdl3-dev libsdl3-image-dev libpango1.0-dev libcairo2-dev libcurl4-openssl-dev libsecret-1-dev libsystemd-dev fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji
      - name: setup Odin
        timeout-minutes: 10
        uses: laytan/setup-odin@v2
        with:
          token: ${{ github.token }}
          release: ${{ env.ODIN_RELEASE }}
      - name: build vendor stb
        run: '"$(odin root)/vendor/stb/src/build_stb.sh"'
      - name: check and test
        run: |
          just check
          just test
      - name: build
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: just release
      - name: archive
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: sh packaging/linux/bundle.sh "build/spoti-linux-${{ matrix.arch }}-${GITHUB_SHA:0:12}.tar.zst"
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        with:
          path: build/spoti-linux-${{ matrix.arch }}-*.tar.zst
          archive: false
          if-no-files-found: error

  macos:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: install Homebrew packages
        timeout-minutes: 10
        run: brew install just pkg-config sdl3 sdl3_image curl
      - name: setup Odin
        timeout-minutes: 10
        uses: laytan/setup-odin@v2
        with:
          token: ${{ github.token }}
          release: ${{ env.ODIN_RELEASE }}
      - name: build vendor stb
        run: '"$(odin root)/vendor/stb/src/build_stb.sh"'
      - name: test native text, credentials, audio, and image codecs
        run: |
          just _prepare
          odin test ui -define:ODIN_TEST_THREADS=1 -extra-linker-flags:"-L$(brew --prefix)/lib"
          odin test spotify/credential
          odin test spotify/audio -extra-linker-flags:"-L$(brew --prefix curl)/lib"
          odin test spotify/artwork -extra-linker-flags:"-L$(brew --prefix)/lib"
          odin test . -define:ODIN_TEST_NAMES=main.svg_icons_decode_to_white_tint_masks -extra-linker-flags:"-L$(brew --prefix curl)/lib -L$(brew --prefix)/lib"
      - run: just release
      - name: bundle
        run: sh packaging/macos/bundle.sh "build/spoti-macos-arm64-${GITHUB_SHA:0:12}.tar.zst"
      - uses: actions/upload-artifact@v7
        with:
          path: build/spoti-macos-arm64-*.tar.zst
          archive: false
          if-no-files-found: error

  windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      MSYS_NO_PATHCONV: "1"
      SPOTI_LINKER_FLAGS: /LIBPATH:build/deps/SDL3-3.4.18/lib/x64 /LIBPATH:build/deps/SDL3_image-3.4.8/lib/x64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: load Windows compiler environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$vs/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" >> $env:GITHUB_ENV
          }
      - name: setup Odin
        timeout-minutes: 10
        uses: laytan/setup-odin@v2
        with:
          token: ${{ github.token }}
          release: ${{ env.ODIN_RELEASE }}
      - name: install just
        timeout-minutes: 5
        run: |
          winget install --id Casey.Just --exact --silent --accept-package-agreements --accept-source-agreements
          cygpath -w "$LOCALAPPDATA/Microsoft/WinGet/Links" >> "$GITHUB_PATH"
      - name: prepare native dependencies
        run: |
          just _prepare
          for directory in build/deps/SDL3-3.4.18/lib/x64 build/deps/SDL3_image-3.4.8/lib/x64 build/deps/SDL3_image-3.4.8/lib/x64/optional; do
            cygpath -w "$PWD/$directory" >> "$GITHUB_PATH"
          done
      - name: test native text, HTTP, audio, and image codecs
        run: |
          odin test ui -linker:msvc -define:ODIN_TEST_THREADS=1 -extra-linker-flags:"$SPOTI_LINKER_FLAGS"
          odin test spotify/http -linker:msvc
          odin test spotify/audio -linker:msvc
          odin test spotify/artwork -linker:msvc -extra-linker-flags:"$SPOTI_LINKER_FLAGS"
          odin test . -linker:msvc -define:ODIN_TEST_NAMES=main.svg_icons_decode_to_white_tint_masks -extra-linker-flags:"$SPOTI_LINKER_FLAGS"
      - run: just release
      - name: archive
        run: sh packaging/windows/bundle.sh "build/spoti-windows-x64-${GITHUB_SHA:0:12}.tar.zst"
      - uses: actions/upload-artifact@v7
        with:
          path: build/spoti-windows-x64-*.tar.zst
          archive: false
          if-no-files-found: error
