name: desktop builds

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x64
            odin_arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            odin_arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: install dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang just pkg-config libsdl3-dev libsdl3-image-dev libsdl3-ttf-dev libfontconfig-dev libcurl4-openssl-dev libsecret-1-dev libsystemd-dev fonts-noto-core fonts-noto-cjk fonts-noto-extra fonts-noto-color-emoji
          mkdir -p "$RUNNER_TEMP/odin"
          gh release download --repo odin-lang/Odin --pattern 'odin-linux-${{ matrix.odin_arch }}-*.tar.gz' --output "$RUNNER_TEMP/odin.tar.gz"
          tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin" --strip-components=1
          "$RUNNER_TEMP/odin/vendor/stb/src/build_stb.sh"
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"
      - name: check and test
        run: |
          just check
          just test
      - name: build
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: just release
      - name: archive
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: sh packaging/linux/bundle.sh "build/spoti-linux-${{ matrix.arch }}-${GITHUB_SHA:0:12}.tar.zst"
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        with:
          path: build/spoti-linux-${{ matrix.arch }}-*.tar.zst
          archive: false
          if-no-files-found: error

  macos:
    needs: linux
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: install dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          brew install just pkg-config dylibbundler sdl3 sdl3_image sdl3_ttf fontconfig curl
          mkdir -p "$RUNNER_TEMP/odin"
          gh release download --repo odin-lang/Odin --pattern 'odin-macos-arm64-*.tar.gz' --output "$RUNNER_TEMP/odin.tar.gz"
          tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin" --strip-components=1
          "$RUNNER_TEMP/odin/vendor/stb/src/build_stb.sh"
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"
      - name: test native credentials, audio, and image codecs
        run: |
          odin test spotify/credential
          odin test spotify/audio -extra-linker-flags:"-L$(brew --prefix curl)/lib"
          odin test spotify/artwork -extra-linker-flags:"-L$(brew --prefix)/lib"
          odin test . -define:ODIN_TEST_NAMES=main.svg_icons_decode_to_white_tint_masks -extra-linker-flags:"-L$(brew --prefix curl)/lib -L$(brew --prefix)/lib"
      - run: just release
      - name: bundle
        run: sh packaging/macos/bundle.sh "build/spoti-macos-arm64-${GITHUB_SHA:0:12}.tar.zst"
      - uses: actions/upload-artifact@v7
        with:
          path: build/spoti-macos-arm64-*.tar.zst
          archive: false
          if-no-files-found: error

  windows:
    needs: linux
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: install dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          winget install --id odin-lang.Odin --exact --silent --accept-package-agreements --accept-source-agreements
          winget install --id Casey.Just --exact --silent --accept-package-agreements --accept-source-agreements
          vcpkg install --triplet x64-windows fontconfig
          $root = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          $odin = Get-ChildItem "$env:LOCALAPPDATA/Microsoft/WinGet/Packages" -Filter odin.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($odin) {
            $odin.DirectoryName >> $env:GITHUB_PATH
            $env:PATH = "$($odin.DirectoryName);$env:PATH"
          }
          "$env:LOCALAPPDATA/Microsoft/WinGet/Links", "$root/bin" >> $env:GITHUB_PATH
          $env:PATH = "$env:LOCALAPPDATA/Microsoft/WinGet/Links;$root/bin;$env:PATH"
          odin version
          just --version
          "SPOTI_LINKER_FLAGS=/LIBPATH:$PWD/build/deps/SDL3-3.4.18/lib/x64 /LIBPATH:$PWD/build/deps/SDL3_ttf-3.2.2/lib/x64 /LIBPATH:$PWD/build/deps/SDL3_image-3.4.8/lib/x64 /LIBPATH:$root/lib" >> $env:GITHUB_ENV
          "FONTCONFIG_FILE=$root/etc/fonts/fonts.conf" >> $env:GITHUB_ENV
          "FONTCONFIG_PATH=$root/etc/fonts" >> $env:GITHUB_ENV
      - name: prepare SDL bundles
        run: |
          pwsh -NoProfile -File scripts/prepare-windows.ps1
          "$PWD/build/deps/SDL3-3.4.18/lib/x64", "$PWD/build/deps/SDL3_ttf-3.2.2/lib/x64", "$PWD/build/deps/SDL3_image-3.4.8/lib/x64", "$PWD/build/deps/SDL3_image-3.4.8/lib/x64/optional" >> $env:GITHUB_PATH
      - name: test HTTP, audio, and image codecs
        run: |
          odin test spotify/http
          odin test spotify/audio
          odin test spotify/artwork -extra-linker-flags:"$env:SPOTI_LINKER_FLAGS"
          odin test . -define:ODIN_TEST_NAMES=main.svg_icons_decode_to_white_tint_masks -extra-linker-flags:"$env:SPOTI_LINKER_FLAGS"
      - run: just release
      - name: archive
        run: pwsh -NoProfile -File packaging/windows/bundle.ps1 "build/spoti-windows-x64-$($env:GITHUB_SHA.Substring(0,12)).tar.zst"
      - uses: actions/upload-artifact@v7
        with:
          path: build/spoti-windows-x64-*.tar.zst
          archive: false
          if-no-files-found: error
