name: desktop builds

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: install dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang just pkg-config libsdl3-dev libsdl3-ttf-dev libfontconfig-dev libcurl4-openssl-dev libvorbis-dev libwebp-dev libsecret-1-dev libsystemd-dev fonts-noto-core fonts-noto-cjk fonts-noto-extra fonts-noto-color-emoji
          mkdir -p "$RUNNER_TEMP/odin"
          gh release download --repo odin-lang/Odin --pattern 'odin-linux-amd64-*.tar.gz' --output "$RUNNER_TEMP/odin.tar.gz"
          tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin" --strip-components=1
          "$RUNNER_TEMP/odin/vendor/stb/src/build_stb.sh"
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"
      - name: check and test
        run: |
          just check
          just test
      - name: build
        if: github.event_name == 'workflow_dispatch'
        run: just release
      - name: archive
        if: github.event_name == 'workflow_dispatch'
        run: tar --zstd -cf "build/spoti-linux-x64-${GITHUB_SHA:0:12}.tar.zst" build/spoti assets/icons assets/fonts
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          path: build/spoti-linux-x64-*.tar.zst
          archive: false
          if-no-files-found: error

  macos:
    needs: linux
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: install dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          brew install just pkg-config sdl3 sdl3_ttf fontconfig curl libvorbis webp
          mkdir -p "$RUNNER_TEMP/odin"
          gh release download --repo odin-lang/Odin --pattern 'odin-macos-arm64-*.tar.gz' --output "$RUNNER_TEMP/odin.tar.gz"
          tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin" --strip-components=1
          "$RUNNER_TEMP/odin/vendor/stb/src/build_stb.sh"
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"
      - run: just release
      - name: bundle
        run: |
          app=build/Spoti.app/Contents
          mkdir -p "$app/MacOS" "$app/Resources"
          cp build/spoti "$app/MacOS/"
          cp -R assets/icons "$app/Resources/"
          cp -R assets/fonts "$app/Resources/"
          sips -s format icns assets/icons/music.png --out "$app/Resources/AppIcon.icns"
          cp packaging/macos/Info.plist "$app/"
          codesign --force --deep --sign - build/Spoti.app
          codesign --verify --strict build/Spoti.app
      - name: archive
        run: tar --zstd -cf "build/spoti-macos-arm64-${GITHUB_SHA:0:12}.tar.zst" -C build Spoti.app
      - uses: actions/upload-artifact@v7
        with:
          path: build/spoti-macos-arm64-*.tar.zst
          archive: false
          if-no-files-found: error

  windows:
    needs: linux
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: install dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          winget install --id odin-lang.Odin --exact --silent --accept-package-agreements --accept-source-agreements
          winget install --id Casey.Just --exact --silent --accept-package-agreements --accept-source-agreements
          vcpkg install --triplet x64-windows fontconfig curl[websockets] libvorbis libwebp
          $root = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          "$env:LOCALAPPDATA/Microsoft/WinGet/Links", "$root/bin" >> $env:GITHUB_PATH
          "SPOTI_LINKER_FLAGS=/LIBPATH:$PWD/build/deps/SDL3-3.4.18/lib/x64 /LIBPATH:$PWD/build/deps/SDL3_ttf-3.2.2/lib/x64 /LIBPATH:$root/lib" >> $env:GITHUB_ENV
          "FONTCONFIG_FILE=$root/etc/fonts/fonts.conf" >> $env:GITHUB_ENV
          "FONTCONFIG_PATH=$root/etc/fonts" >> $env:GITHUB_ENV
      - run: just release
      - name: archive
        run: |
          Copy-Item build/deps/SDL3-3.4.18/lib/x64/SDL3.dll build/
          Copy-Item build/deps/SDL3_ttf-3.2.2/lib/x64/SDL3_ttf.dll build/
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" build/
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/etc/fonts" build/fontconfig -Recurse
          tar --zstd -cf "build/spoti-windows-x64-$($env:GITHUB_SHA.Substring(0,12)).tar.zst" build/spoti.exe build/*.dll build/fontconfig assets/icons assets/fonts
      - uses: actions/upload-artifact@v7
        with:
          path: build/spoti-windows-x64-*.tar.zst
          archive: false
          if-no-files-found: error
